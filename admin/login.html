<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員登入 — 二手市集</title>
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net;
        style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';
        img-src 'self' https: data:;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        frame-ancestors 'none';
        form-action 'self';
    ">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 自訂樣式 -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center"
      style="min-height:100vh; background: linear-gradient(135deg,#FFFBEB 0%,#FDE68A 60%,#FCD34D 100%);">

<div class="login-card">

    <!-- Logo -->
    <div class="login-logo text-center">🔐</div>
    <h1 class="h4 fw-800 text-center mb-1">管理員後台</h1>
    <p class="text-muted text-center small mb-4">請輸入管理員帳號密碼</p>

    <!-- 錯誤提示 -->
    <div id="alertError" class="alert alert-danger d-none py-2 small" role="alert"></div>

    <!-- 登入表單 -->
    <form id="loginForm" novalidate>
        <div class="mb-3">
            <label for="inputEmail" class="form-label fw-600 small">Email</label>
            <input type="email" id="inputEmail" class="form-control"
                   placeholder="admin@example.com" required autocomplete="email">
        </div>

        <div class="mb-4">
            <label for="inputPassword" class="form-label fw-600 small">密碼</label>
            <div class="input-group">
                <input type="password" id="inputPassword" class="form-control"
                       placeholder="輸入密碼" required autocomplete="current-password">
                <button class="btn btn-outline-secondary" type="button"
                        id="togglePassword" title="顯示/隱藏密碼">
                    👁
                </button>
            </div>
        </div>

        <button type="submit" id="btnLogin"
                class="btn btn-warning w-100 fw-700 py-2">
            登入後台
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="../index.html" class="text-muted small text-decoration-none">
            ← 返回商品列表
        </a>
    </div>
</div>

<!-- ── Scripts ── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
