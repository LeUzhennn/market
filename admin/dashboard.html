<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 — 二手市集</title>
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net;
        style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';
        img-src 'self' https: data:;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        frame-ancestors 'none';
        form-action 'self';
    ">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 自訂樣式 -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Auth 驗證 Overlay（驗證期間顯示） -->
<div id="authChecking" class="auth-checking">
    <div class="text-center">
        <div class="spinner-border text-warning mb-3" role="status"></div>
        <p class="text-muted">驗證身份中…</p>
    </div>
</div>

<!-- ── 主要內容（驗證通過後顯示） ── -->
<div id="dashboardContent" class="d-none">

    <!-- 頂部導覽列 -->
    <nav class="navbar admin-nav navbar-expand-lg">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="../index.html" target="_blank">
                🏪 <span class="site-name">二手市集</span>
                <span class="badge bg-warning text-dark ms-2 small">管理後台</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="../index.html" target="_blank"
                   class="btn btn-outline-secondary btn-sm text-light border-light">
                    瀏覽前台
                </a>
                <button id="btnLogout"
                        class="btn btn-outline-danger btn-sm">
                    登出
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">

        <!-- 統計數字 -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-4">
                <div class="stat-card">
                    <div class="stat-icon" style="background:#FEF3C7">📦</div>
                    <div>
                        <div class="stat-number" id="statTotal">—</div>
                        <div class="stat-label">全部商品</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="stat-card">
                    <div class="stat-icon" style="background:#DCFCE7">✅</div>
                    <div>
                        <div class="stat-number" id="statAvailable">—</div>
                        <div class="stat-label">販售中</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="stat-card">
                    <div class="stat-icon" style="background:#FEE2E2">🏷️</div>
                    <div>
                        <div class="stat-number" id="statSold">—</div>
                        <div class="stat-label">已售出</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作列 -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-800 mb-0">商品管理</h5>
            <button id="btnAddProduct" class="btn btn-warning fw-700">
                ＋ 新增商品
            </button>
        </div>

        <!-- 商品列表 -->
        <div class="bg-white rounded-3 shadow-sm overflow-hidden">
            <div class="table-responsive">
                <table class="table admin-table mb-0">
                    <thead>
                        <tr>
                            <th style="width:80px">圖片</th>
                            <th>商品名稱</th>
                            <th>售價</th>
                            <th>數量</th>
                            <th>狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-4 text-muted">
                                <div class="spinner-border spinner-border-sm me-2"></div>載入中…
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 空狀態 -->
        <div id="emptyProducts" class="text-center py-5 d-none">
            <div style="font-size:3.5rem">📭</div>
            <p class="text-muted mt-2">目前沒有任何商品，點擊「新增商品」開始上架</p>
        </div>

    </div><!-- /container -->
</div><!-- /dashboardContent -->


<!-- ============================================================
     新增 / 編輯 商品 Modal
     ============================================================ -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-800" id="modalTitle">新增商品</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm" novalidate>

                    <!-- 商品名稱 -->
                    <div class="mb-3">
                        <label class="form-label fw-600">
                            商品名稱 <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="fieldTitle" class="form-control"
                               placeholder="例：Nike 運動鞋 US9">
                    </div>

                    <!-- 分類 / 價格 / 數量 (一行三欄) -->
                    <div class="row g-3 mb-3">
                        <div class="col-sm-4">
                            <label class="form-label fw-600">
                                分類 <span class="text-danger">*</span>
                            </label>
                            <select id="fieldCategory" class="form-select">
                                <!-- 由 JS 動態填入 -->
                            </select>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label fw-600">
                                售價（NT$）<span class="text-danger">*</span>
                            </label>
                            <input type="number" id="fieldPrice" class="form-control"
                                   placeholder="500" min="0">
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label fw-600">
                                數量 <span class="text-danger">*</span>
                            </label>
                            <input type="number" id="fieldQuantity" class="form-control"
                                   placeholder="1" min="0" value="1">
                        </div>
                    </div>

                    <!-- 商品狀態（編輯時用） -->
                    <div class="mb-3">
                        <label class="form-label fw-600">狀態</label>
                        <select id="fieldStatus" class="form-select">
                            <option value="available">販售中</option>
                            <option value="sold">已售出</option>
                        </select>
                    </div>

                    <!-- 商品說明 -->
                    <div class="mb-3">
                        <label class="form-label fw-600">商品說明</label>
                        <textarea id="fieldDescription" class="form-control" rows="4"
                                  placeholder="商品的品牌、尺寸、狀況、瑕疵說明…"></textarea>
                    </div>

                    <!-- 圖片上傳 -->
                    <div class="mb-2">
                        <label class="form-label fw-600">商品圖片</label>

                        <!-- 現有圖片（編輯模式） -->
                        <div id="existingImgsSection" class="d-none mb-2">
                            <p class="text-muted small mb-1">目前圖片（點擊 ✕ 可刪除）</p>
                            <div class="img-preview-grid" id="existingImgsGrid"></div>
                        </div>

                        <!-- 新圖片預覽 -->
                        <div class="img-preview-grid" id="newImgPreview"></div>

                        <!-- 上傳按鈕 -->
                        <label for="imageInput" class="upload-area d-block mt-2">
                            <div>📁 點擊選擇圖片（可多選）</div>
                            <div class="small mt-1 text-muted">支援 JPG / PNG / WEBP</div>
                        </label>
                        <input type="file" id="imageInput" class="d-none"
                               accept="image/*" multiple>
                    </div>

                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">取消</button>
                <button type="button" id="btnSave" class="btn btn-warning fw-700">
                    新增商品
                </button>
            </div>
        </div>
    </div>
</div>


<!-- ============================================================
     刪除確認 Modal
     ============================================================ -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-800 text-danger">⚠️ 確認刪除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-0">
                <p class="mb-1">確定要刪除以下商品嗎？</p>
                <p class="fw-700" id="deleteProductName"></p>
                <p class="text-danger small mb-0">此操作無法復原，商品圖片也將一併刪除。</p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">取消</button>
                <button type="button" id="btnConfirmDelete"
                        class="btn btn-danger fw-700">確認刪除</button>
            </div>
        </div>
    </div>
</div>


<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>


<!-- ── Scripts ── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
