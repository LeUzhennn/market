<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品詳情 — 二手市集</title>
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net;
        style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';
        img-src 'self' https: data:;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        frame-ancestors 'none';
        form-action 'self';
    ">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 自訂樣式 -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .detail-carousel-img {
            height: 380px;
            object-fit: contain;
            background: #f8fafc;
        }
        @media (max-width: 576px) {
            .detail-carousel-img { height: 260px; }
        }
    </style>
</head>
<body>

<!-- ── 頂部導覽列 ── -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            🏪 <span class="site-name">二手市集</span>
        </a>
        <a href="index.html"
           class="ms-auto btn btn-outline-secondary btn-sm">
            ← 回商品列表
        </a>
    </div>
</nav>

<!-- ── 麵包屑 ── -->
<div class="container mt-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="index.html" class="text-warning text-decoration-none">首頁</a></li>
            <li class="breadcrumb-item active" id="breadcrumbTitle">商品詳情</li>
        </ol>
    </nav>
</div>

<!-- ── 載入中 ── -->
<div id="loadingState" class="text-center py-5">
    <div class="spinner-border text-warning" role="status"></div>
    <p class="mt-3 text-muted">商品載入中…</p>
</div>

<!-- ── 找不到商品 ── -->
<div id="notFound" class="container text-center py-5 d-none">
    <div style="font-size:4rem">🔍</div>
    <h4 class="mt-3">找不到此商品</h4>
    <p class="text-muted">商品可能已下架或連結有誤</p>
    <a href="index.html" class="btn btn-warning mt-2">回商品列表</a>
</div>

<!-- ── 商品詳情內容 ── -->
<main id="content" class="container py-4 d-none">
    <div class="row g-4 g-lg-5">

        <!-- 左欄：圖片輪播 -->
        <div class="col-lg-6">
            <div id="carouselWrapper">
                <div id="productCarousel" class="carousel slide rounded-3 overflow-hidden shadow-sm"
                     data-bs-ride="false">

                    <!-- 指示點 -->
                    <div class="carousel-indicators" id="carouselIndicators"></div>

                    <!-- 圖片 -->
                    <div class="carousel-inner" id="carouselInner"></div>

                    <!-- 箭頭 -->
                    <button class="carousel-control-prev" id="carouselPrev"
                            type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" id="carouselNext"
                            type="button" data-bs-target="#productCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 右欄：商品資訊 -->
        <div class="col-lg-6">

            <!-- 分類 + 狀態 -->
            <div class="d-flex align-items-center gap-2 mb-2">
                <span class="category-tag" id="productCategory"></span>
                <span id="productStatus"></span>
            </div>

            <!-- 名稱 -->
            <h1 class="h3 fw-800 mb-3" id="productTitle"></h1>

            <!-- 已售出提示 -->
            <div id="soldBanner"
                 class="alert alert-danger d-none d-flex align-items-center gap-2 mb-3"
                 role="alert">
                <span style="font-size:1.3rem">😔</span>
                <span>此商品已售出，歡迎繼續瀏覽其他商品</span>
            </div>

            <hr class="divider">

            <!-- 價格 -->
            <div class="mb-3">
                <div class="detail-label">售價</div>
                <div class="detail-price" id="productPrice"></div>
            </div>

            <!-- 數量 -->
            <div class="mb-3">
                <div class="detail-label">數量</div>
                <div class="detail-value" id="productQty"></div>
            </div>

            <hr class="divider">

            <!-- 商品說明 -->
            <div class="mb-4">
                <div class="detail-label mb-1">商品說明</div>
                <div class="detail-value text-muted" id="productDesc"
                     style="white-space: pre-wrap; line-height: 1.7;"></div>
            </div>

            <!-- FB 私訊按鈕 -->
            <a id="fbBtn" href="#" target="_blank" rel="noopener noreferrer"
               class="btn-fb btn-fb-block">
                <!-- Facebook Icon -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0
                    18.1 4.388 23.094 10.125 24v-8.437H7.078V12.07h3.047V9.427c0-3.007
                    1.792-4.669 4.532-4.669 1.313 0 2.686.234 2.686.234v2.953H15.83
                    c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.494h-2.796V24
                    C19.612 23.094 24 18.1 24 12.073z"/>
                </svg>
                Facebook 私訊詢問
            </a>

            <p class="text-muted small mt-3">
                💬 點擊後將跳轉至 Facebook，請直接私訊詢問商品細節與面交安排
            </p>

        </div>
    </div>

    <!-- 回列表按鈕 -->
    <div class="mt-5 pt-3 border-top">
        <a href="index.html" class="btn btn-outline-secondary">
            ← 繼續瀏覽其他商品
        </a>
    </div>

</main>

<!-- ── Footer ── -->
<footer class="text-center">
    <div class="container">
        <p class="mb-1 fw-600 text-white">
            🏪 <span class="site-name">二手市集</span>
        </p>
        <p class="mb-0">有意購買請透過 Facebook 私訊洽詢</p>
    </div>
</footer>

<!-- ── Scripts ── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/product-detail.js"></script>
</body>
</html>
