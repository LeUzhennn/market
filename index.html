<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手市集</title>
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net;
        style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline';
        img-src 'self' https: data:;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        frame-ancestors 'none';
        form-action 'self';
    ">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 自訂樣式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── 頂部導覽列 ── -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            🏪 <span class="site-name">二手市集</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <a href="admin/login.html"
               class="btn btn-outline-warning btn-sm fw-600 d-none d-md-inline-flex">
                ⚙️ 管理後台
            </a>
        </div>
    </div>
</nav>

<!-- ── Hero / 搜尋區 ── -->
<section class="hero-section">
    <div class="container text-center">
        <h1>🛍️ 精選二手好物</h1>
        <p class="mb-0">瀏覽喜歡的商品，透過 Facebook 私訊詢問</p>
        <!-- 搜尋 -->
        <div class="search-wrapper">
            <div class="input-group">
                <input type="text" id="searchInput"
                       class="form-control"
                       placeholder="搜尋商品名稱或描述…"
                       autocomplete="off">
                <button class="btn-search" id="btnSearch" type="button">
                    搜尋
                </button>
            </div>
        </div>
    </div>
</section>

<!-- ── 分類篩選 ── -->
<div class="category-pills-wrapper">
    <div class="container">
        <div class="category-pills" id="categoryPills">
            <!-- 由 JS 動態生成 -->
        </div>
    </div>
</div>

<!-- ── 商品列表 ── -->
<main class="container section-gap">

    <!-- 商品數量 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="productCount" class="text-muted small fw-500"></span>
    </div>

    <!-- 載入中 -->
    <div id="loadingState" class="text-center py-5">
        <div class="spinner-border text-warning" role="status"></div>
        <p class="mt-3 text-muted">商品載入中，請稍候…</p>
    </div>

    <!-- 載入失敗 -->
    <div id="errorState" class="text-center py-5 d-none">
        <div style="font-size:3rem">😕</div>
        <p class="text-muted mt-2">載入失敗，請重新整理頁面</p>
        <button class="btn btn-warning" onclick="location.reload()">重新整理</button>
    </div>

    <!-- 空狀態 -->
    <div id="emptyState" class="text-center py-5 d-none">
        <div style="font-size:3.5rem">📭</div>
        <p class="text-muted mt-2">目前沒有符合條件的商品</p>
    </div>

    <!-- 商品格狀列表 -->
    <div class="row" id="productGrid">
        <!-- 由 JS 動態渲染 -->
    </div>

</main>

<!-- ── Footer ── -->
<footer class="text-center">
    <div class="container">
        <p class="mb-1 fw-600 text-white">
            🏪 <span class="site-name">二手市集</span>
        </p>
        <p class="mb-0">有意購買請透過 Facebook 私訊洽詢</p>
    </div>
</footer>

<!-- ── Scripts ── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/products.js"></script>
</body>
</html>
